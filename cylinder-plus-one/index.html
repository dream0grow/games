<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>원기둥 하나 더 넣기</title>
<meta name="description" content="상자에 꽉 찬 원기둥 40개를 옮겨 41개를 넣어 보며 정사각형 구조와 정육각형(벌집) 구조를 비교하는 3D 수학 탐구 게임" />
<style>
  :root {
    --bg: #f6efe3;
    --panel: rgba(255, 252, 245, 0.94);
    --panel-solid: #fffcf5;
    --ink: #3a2410;
    --ink-soft: #7a5a36;
    --line: #ecd9b8;
    --accent: #c2560c;
    --accent-soft: #ffe7cc;
    --good: #2f9e44;
    --good-soft: #dff5e3;
    --bad: #d6336c;
    --blue: #2563eb;
    --blue-soft: #dbe8ff;
    --shadow: 0 10px 30px rgba(120, 70, 10, 0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --panel: rgba(38, 30, 22, 0.94);
      --panel-solid: #261e16;
      --ink: #f5e8d6;
      --ink-soft: #cdb392;
      --line: #4a3a28;
      --accent: #ff9a4d;
      --accent-soft: #4a2e17;
      --good: #5ad07a;
      --good-soft: #1f3a26;
      --blue: #7aa7ff;
      --blue-soft: #1d2a45;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }
  }
  :root[data-theme="dark"] {
    --panel: rgba(38, 30, 22, 0.94);
    --panel-solid: #261e16;
    --ink: #f5e8d6;
    --ink-soft: #cdb392;
    --line: #4a3a28;
    --accent: #ff9a4d;
    --accent-soft: #4a2e17;
    --good: #5ad07a;
    --good-soft: #1f3a26;
    --blue: #7aa7ff;
    --blue-soft: #1d2a45;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* ---------- 상단 바 ---------- */
  #topbar {
    position: fixed; top: 10px; left: 12px; right: 12px; z-index: 5;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    pointer-events: none;
  }
  #topbar > * { pointer-events: auto; }
  .brand {
    background: var(--panel); border: 2px solid var(--line); border-radius: 14px;
    padding: 6px 12px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 8px;
    font-weight: 800; font-size: 17px; white-space: nowrap;
  }
  .brand a { text-decoration: none; color: var(--ink-soft); font-size: 13px; font-weight: 700; }
  .tabs {
    display: flex; gap: 4px; background: var(--panel); border: 2px solid var(--line);
    border-radius: 14px; padding: 4px; box-shadow: var(--shadow); flex-wrap: wrap;
  }
  .tab {
    border: 0; background: transparent; padding: 7px 12px; border-radius: 10px;
    font-weight: 700; font-size: 14px; color: var(--ink-soft); white-space: nowrap;
  }
  .tab.on { background: var(--accent); color: #fff; }
  .iconbtn {
    background: var(--panel); border: 2px solid var(--line); border-radius: 12px;
    padding: 7px 10px; box-shadow: var(--shadow); font-size: 15px; font-weight: 700;
  }
  .spacer { flex: 1; }

  /* ---------- 상태 칩 ---------- */
  #stats {
    position: fixed; left: 12px; top: 64px; z-index: 4;
    display: flex; flex-direction: column; gap: 6px; pointer-events: none;
  }
  .chip {
    background: var(--panel); border: 2px solid var(--line); border-radius: 12px;
    padding: 6px 12px; box-shadow: var(--shadow); font-size: 14px; font-weight: 700;
    display: flex; align-items: baseline; gap: 6px; white-space: nowrap;
  }
  .chip b { font-size: 22px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .chip.big b { font-size: 30px; }
  .chip small { color: var(--ink-soft); font-weight: 600; }
  .chip.win { border-color: var(--good); }
  .chip.win b { color: var(--good); }
  .meter { width: 120px; height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; align-self: center; }
  .meter i { display: block; height: 100%; background: linear-gradient(90deg, #f59f00, #e8590c); width: 0; transition: width .4s; }

  /* ---------- 오른쪽 패널 ---------- */
  #panel {
    position: fixed; right: 12px; top: 64px; bottom: 84px; width: 350px; z-index: 4;
    background: var(--panel); border: 2px solid var(--line); border-radius: 18px;
    box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden;
    -webkit-user-select: text; user-select: text;
  }
  #panelHead {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 14px; border-bottom: 2px solid var(--line); font-weight: 800; font-size: 16px;
  }
  #panelToggle { white-space: nowrap; flex-shrink: 0; border: 0; background: var(--accent-soft); border-radius: 8px; padding: 4px 10px; font-weight: 700; font-size: 13px; }
  #panelBody { padding: 12px 14px 16px; overflow-y: auto; line-height: 1.6; font-size: 14.5px; }
  #panel.collapsed #panelBody { display: none; }
  #panel.collapsed { bottom: auto; }
  .card {
    background: var(--panel-solid); border: 2px solid var(--line); border-radius: 14px;
    padding: 10px 12px; margin-bottom: 10px;
  }
  .card h3 { font-size: 15px; margin-bottom: 4px; }
  .card p + p { margin-top: 6px; }
  .mission { border-color: var(--accent); background: var(--accent-soft); }
  .btnrow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .btn {
    border: 2px solid var(--line); background: var(--panel-solid); border-radius: 10px;
    padding: 7px 11px; font-weight: 700; font-size: 14px;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.on { background: var(--blue-soft); border-color: var(--blue); color: var(--blue); }
  .btn:disabled { opacity: .45; cursor: default; }
  .hint { background: var(--blue-soft); border-color: var(--blue); }
  .hint b { color: var(--blue); }
  .muted { color: var(--ink-soft); font-size: 13px; }
  table.rec { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px; }
  table.rec th, table.rec td { border: 1px solid var(--line); padding: 4px 5px; text-align: center; }
  table.rec th { background: var(--accent-soft); }
  .num { font-variant-numeric: tabular-nums; font-weight: 800; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 14px; }
  .kv span:nth-child(odd) { color: var(--ink-soft); }
  .stepper { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  .stepper label { width: 44px; font-weight: 700; }
  .stepper button { width: 34px; height: 34px; border-radius: 10px; border: 2px solid var(--line); background: var(--panel-solid); font-weight: 800; font-size: 18px; }
  .stepper output { width: 30px; text-align: center; font-weight: 800; font-size: 18px; }
  .reveal { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; margin-top: 8px; }
  .reveal .val { font-weight: 800; font-size: 18px; min-width: 36px; text-align: right; font-variant-numeric: tabular-nums; }

  /* ---------- 하단 도구 ---------- */
  #toolbar {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 12px; z-index: 5;
    display: flex; gap: 6px; background: var(--panel); border: 2px solid var(--line);
    border-radius: 16px; padding: 6px; box-shadow: var(--shadow); max-width: calc(100vw - 24px);
    overflow-x: auto;
  }
  .tool {
    border: 0; background: transparent; border-radius: 10px; padding: 6px 9px;
    display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 54px;
    font-size: 11.5px; font-weight: 700; color: var(--ink-soft); white-space: nowrap;
  }
  .tool span { font-size: 20px; line-height: 1.1; }
  .tool:hover { background: var(--accent-soft); }
  .tool.on { background: var(--blue-soft); color: var(--blue); }

  /* ---------- 떠 있는 것들 ---------- */
  #band { position: fixed; border: 2px dashed var(--blue); background: rgba(37, 99, 235, 0.12); z-index: 3; display: none; pointer-events: none; border-radius: 4px; }
  #label {
    position: fixed; z-index: 3; pointer-events: none; display: none; transform: translate(-50%, -120%);
    background: #1f2937; color: #fff; font-weight: 800; padding: 5px 10px; border-radius: 10px; font-size: 15px;
    white-space: nowrap; box-shadow: 0 4px 12px rgba(0,0,0,.3);
  }
  #toast {
    position: fixed; left: 50%; top: 72px; transform: translateX(-50%) translateY(-10px); z-index: 20;
    background: #1f2937; color: #fff; padding: 10px 16px; border-radius: 12px; font-weight: 700;
    opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; max-width: calc(100vw - 32px); text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 30; }

  /* ---------- 모달 ---------- */
  .modal {
    position: fixed; inset: 0; z-index: 40; background: rgba(40, 24, 8, 0.45);
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  .modal.show { display: flex; }
  .sheet {
    background: var(--panel-solid); color: var(--ink); border-radius: 22px; border: 3px solid var(--line);
    box-shadow: var(--shadow); width: min(560px, 100%); max-height: calc(100vh - 32px); overflow-y: auto;
    padding: 22px 22px 18px; line-height: 1.65; -webkit-user-select: text; user-select: text;
  }
  .sheet h2 { font-size: 24px; margin-bottom: 8px; color: var(--accent); }
  .sheet .lead { font-size: 16px; margin-bottom: 12px; }
  .sheet ul { padding-left: 4px; list-style: none; margin: 8px 0 14px; }
  .sheet li { margin: 6px 0; display: flex; gap: 8px; }
  .sheet li > span:first-child { flex: 0 0 26px; text-align: center; }
  .sheet .btnrow { justify-content: flex-end; margin-top: 14px; }
  .sheet .btn { padding: 10px 16px; font-size: 15px; }
  .qopts { display: grid; gap: 8px; margin: 12px 0; }
  .qopt { text-align: left; border: 2px solid var(--line); background: var(--panel-solid); border-radius: 12px; padding: 11px 14px; font-weight: 700; font-size: 15.5px; }
  .qopt:hover:not(:disabled) { border-color: var(--accent); }
  .qopt.right { border-color: var(--good); background: var(--good-soft); }
  .qopt.wrong { border-color: var(--bad); background: rgba(214, 51, 108, .12); }
  .qexp { border-radius: 12px; padding: 10px 12px; background: var(--blue-soft); display: none; }
  .qexp.show { display: block; }
  .qprog { display: flex; gap: 4px; margin-bottom: 10px; }
  .qprog i { flex: 1; height: 6px; border-radius: 99px; background: var(--line); }
  .qprog i.done { background: var(--good); }
  .qprog i.miss { background: var(--bad); }
  .qprog i.cur { background: var(--accent); }
  .bigscore { font-size: 48px; font-weight: 900; color: var(--accent); text-align: center; margin: 6px 0; }
  svg text { font-family: inherit; }

  /* ---------- 모바일 ---------- */
  @media (max-width: 760px) {
    #topbar { top: 8px; left: 8px; right: 8px; gap: 6px; }
    .brand { font-size: 15px; padding: 5px 10px; }
    .brand a { display: none; }
    .tab { padding: 6px 9px; font-size: 13px; }
    #stats { top: auto; bottom: calc(38vh + 12px); left: 8px; flex-direction: row; flex-wrap: wrap; right: 8px; }
    .chip { padding: 4px 9px; font-size: 12.5px; }
    .chip b { font-size: 17px; }
    .chip.big b { font-size: 20px; }
    .meter { width: 60px; }
    #panel { left: 8px; right: 8px; width: auto; top: auto; bottom: 76px; height: calc(38vh - 64px); }
    #panel.collapsed { height: auto; }
    #toolbar { bottom: 8px; }
    .tool { min-width: 46px; padding: 5px 6px; font-size: 10.5px; }
    .tool span { font-size: 18px; }
  }
  @media (max-width: 760px) and (max-height: 560px) {
    #panel { display: none; }
    #stats { bottom: 76px; }
  }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="scene"></canvas>

<div id="topbar">
  <div class="brand">🥫 원기둥 하나 더 넣기 <a href="../">← 게임 목록</a></div>
  <div class="tabs" role="tablist">
    <button class="tab on" data-mode="challenge">① 도전</button>
    <button class="tab" data-mode="explore">② 탐구</button>
    <button class="tab" data-mode="lab">③ 실험실</button>
    <button class="tab" data-mode="quiz">④ 퀴즈</button>
  </div>
  <div class="spacer"></div>
  <button class="iconbtn" id="helpBtn" title="조작 방법">❓</button>
</div>

<div id="stats"></div>

<aside id="panel">
  <div id="panelHead"><span id="panelTitle">도전</span><button id="panelToggle">접기</button></div>
  <div id="panelBody"></div>
</aside>

<div id="toolbar">
  <button class="tool" data-act="undo" title="되돌리기 (Ctrl+Z)"><span>↩️</span>되돌리기</button>
  <button class="tool" data-act="viewTop" title="위에서 내려다보기"><span>⬇️</span>위에서</button>
  <button class="tool" data-act="viewTilt" title="비스듬히 보기"><span>📐</span>비스듬히</button>
  <button class="tool on" data-act="magnet" title="놓으면 옆 캔 사이 홈에 딱 맞춰 줘요"><span>🧲</span>자석</button>
  <button class="tool" data-act="deselect" title="선택 해제 (Esc)"><span>✖️</span>선택해제</button>
  <button class="tool" data-act="skin" title="나무 원기둥 ↔ 음료 캔"><span>🪵</span>모양</button>
  <button class="tool" data-act="sound" title="소리 켜기/끄기"><span>🔊</span>소리</button>
  <button class="tool" data-act="reset" title="처음 상태로"><span>🔄</span>처음부터</button>
</div>

<div id="band"></div>
<div id="label"></div>
<div id="toast"></div>
<canvas id="fx"></canvas>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =========================================================
   기본 치수 (캔 지름 = 1)
   ========================================================= */
const R = 0.5;                 // 캔 반지름
const CAN_H = 1.05;            // 캔 높이
const T = 0.28;                // 상자 벽 두께
const WALL_H = 0.55;           // 상자 벽 높이
const TABLE_Y = -0.16;         // 책상 높이 (상자 바닥 두께만큼 아래)
const LIFT = 0.95;             // 들어 올릴 때 높이
const S3 = Math.sqrt(3) / 2;   // 엇갈린 줄 사이 간격 ≈ 0.866
const EPS = 1e-4;
let W = 8, H = 5;              // 상자 안쪽 크기 (가로 × 세로)
const GOAL = 41;

/* =========================================================
   렌더러 · 장면 · 카메라
   ========================================================= */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#efe3cf');

const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
camera.position.set(1, 11, 9);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.12;
controls.mouseButtons = { LEFT: -1, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };
controls.touches = { ONE: -1, TWO: THREE.TOUCH.DOLLY_ROTATE };
controls.enablePan = false;
controls.minDistance = 4;
controls.maxDistance = 45;
controls.maxPolarAngle = 1.35;

scene.add(new THREE.HemisphereLight(0xfff6e8, 0x8a6a4a, 1.0));
const sun = new THREE.DirectionalLight(0xffffff, 1.9);
sun.position.set(-6, 16, 9);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -16; sun.shadow.camera.right = 16;
sun.shadow.camera.top = 12; sun.shadow.camera.bottom = -12;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 50;
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.02;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xffe2c0, 0.45);
fill.position.set(8, 6, -6);
scene.add(fill);

/* =========================================================
   질감(텍스처) — 캔버스로 직접 그림
   ========================================================= */
let seed = 7;
const rng = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
function cv(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function tex(c, rep) {
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); }
  return t;
}
function drawStar(g, x, y, ro, ri, color) {
  g.beginPath();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 ? ri : ro, a = -Math.PI / 2 + i * Math.PI / 5;
    g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
  }
  g.closePath(); g.fillStyle = color; g.fill();
  g.lineWidth = 4; g.strokeStyle = 'rgba(255,255,255,.85)'; g.stroke();
  g.fillStyle = '#fff'; g.font = '900 30px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('+1', x, y + 3);
}
const TONES = [[28, 58, 70], [24, 60, 63], [32, 52, 76], [20, 50, 58]];
function woodTop(tone, star) {
  const c = cv(256, 256), g = c.getContext('2d'); const [h, s, l] = tone;
  g.fillStyle = `hsl(${h},${s}%,${l}%)`; g.fillRect(0, 0, 256, 256);
  const cx = 128 + (rng() - 0.5) * 120, cy = 128 + (rng() - 0.5) * 120;
  for (let r = 3; r < 420; r += 4 + rng() * 10) {
    g.strokeStyle = `hsla(${h - 4},${s + 6}%,${l - 20}%,${0.05 + rng() * 0.13})`;
    g.lineWidth = 1 + rng() * 2.4;
    g.beginPath(); g.ellipse(cx, cy, r, r * (0.92 + rng() * 0.16), rng() * 0.4, 0, Math.PI * 2); g.stroke();
  }
  const grd = g.createRadialGradient(128, 128, 96, 128, 128, 128);
  grd.addColorStop(0, 'rgba(0,0,0,0)'); grd.addColorStop(1, 'rgba(110,50,10,0.38)');
  g.fillStyle = grd; g.fillRect(0, 0, 256, 256);
  if (star) drawStar(g, 128, 128, 62, 30, '#dc2626');
  return tex(c);
}
function woodSide(tone) {
  const c = cv(512, 128), g = c.getContext('2d'); const [h, s, l] = tone;
  g.fillStyle = `hsl(${h},${s}%,${l - 3}%)`; g.fillRect(0, 0, 512, 128);
  for (let i = 0; i < 90; i++) {
    const x = rng() * 512, w = (rng() - 0.5) * 18;
    g.strokeStyle = `hsla(${h - 5},${s + 5}%,${l - 22}%,${0.04 + rng() * 0.14})`;
    g.lineWidth = 0.8 + rng() * 2.2;
    g.beginPath(); g.moveTo(x, 0); g.quadraticCurveTo(x + w, 64, x + (rng() - 0.5) * 6, 128); g.stroke();
  }
  return tex(c);
}
const CAN_COLORS = ['#e03131', '#1971c2', '#2f9e44', '#f08c00', '#7048e8', '#0c8599'];
function canSide(color, special) {
  const c = cv(512, 128), g = c.getContext('2d');
  g.fillStyle = special ? '#fff' : color; g.fillRect(0, 0, 512, 128);
  g.fillStyle = special ? '#dc2626' : 'rgba(255,255,255,.9)';
  g.beginPath(); g.moveTo(0, 70);
  for (let x = 0; x <= 512; x += 8) g.lineTo(x, 66 + Math.sin(x / 512 * Math.PI * 4) * 12);
  g.lineTo(512, 86); for (let x = 512; x >= 0; x -= 8) g.lineTo(x, 84 + Math.sin(x / 512 * Math.PI * 4) * 12);
  g.closePath(); g.fill();

/* =========================================================
   연결선 · 도형(삼각형/사각형) 그리기

const overlay = new THREE.Group(); scene.add(overlay);

function rebuildOverlay() {
  while (overlay.children.length) { const m = overlay.children.pop(); if (m.geometry !== dotGeo) m.geometry.dispose(); }
  if (!state.showShapes) return;
  const ins = act().filter(isInside);
  const touch = (a, b) => Math.abs(Math.hypot(a.x - b.x, a.z - b.z) - 1) < 0.012;
  const y = CAN_H + 0.012;
  const pairs = [];
  for (let i = 0; i < ins.length; i++) for (let j = i + 1; j < ins.length; j++) if (touch(ins[i], ins[j])) pairs.push([ins[i], ins[j]]);
  const polys = [], seen = new Set();
  const nb = new Map(ins.map(c => [c, []]));
  for (const [a, b] of pairs) { nb.get(a).push(b); nb.get(b).push(a); }
  for (const [a, b] of pairs) {
    for (const c of nb.get(a)) if (c !== b && nb.get(b).includes(c)) {
      const key = [a.id, b.id, c.id].sort((p, q) => p - q).join(',');

      const d = nb.get(a).find(k => Math.abs(k.x - (a.x + px)) < 0.02 && Math.abs(k.z - (a.z + pz)) < 0.02);
      if (c && d && touch(c, d)) {
        const key = [a.id, b.id, c.id, d.id].sort((p, q) => p - q).join(',');
        if (!seen.has(key)) { seen.add(key); polys.push({ pts: [a, b, c, d], mat: ovSqMat }); }

  }

  overlay.userData.sq = polys.filter(p => p.pts.length === 4).length;
}

/* =========================================================

const raycaster = new THREE.Raycaster();

const touches = new Map();

function setNDC(e) {

function pickCan(e) {

// 끌 때 바닥에 보이는 '놓일 자리' 표시
const ghostGeo = new THREE.RingGeometry(R * 0.78, R, 40);

const ghostOkFill = new THREE.MeshBasicMaterial({ color: '#4ade80', transparent: true, opacity: 0.35, depthWrite: false });

function showGhosts(pts, ok) {

    const ring = new THREE.Mesh(ghostGeo, ghostOk), disk = new THREE.Mesh(ghostDiskGeo, ghostOkFill);
    ring.rotation.x = disk.rotation.x = -Math.PI / 2; g.add(ring, disk); g.renderOrder = 5;

    g.visible = true; g.position.set(pts[i].x, baseY(pts[i].x, pts[i].z) + 0.012, pts[i].z);

canvas.addEventListener('contextmenu', e => e.preventDefault());

  }

  const sx = e.clientX, sy = e.clientY;

const fx = $('#fx'), fg = fx.getContext('2d');
let parts = [];
function confetti() {
  fx.width = innerWidth; fx.height = innerHeight;
  const cols = ['#f59f00', '#e8590c', '#2f9e44', '#1971c2', '#e64980', '#fab005'];
  for (let i = 0; i < 160; i++) parts.push({ x: innerWidth / 2 + (Math.random() - .5) * 200, y: innerHeight * 0.35, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4, r: Math.random() * 6 + 4, c: cols[i % cols.length], a: Math.random() * 6, life: 1 });
}
function drawFx() {
  if (!parts.length) return;
  fg.clearRect(0, 0, fx.width, fx.height);
  for (const p of parts) {
    p.vy += 0.35; p.x += p.vx; p.y += p.vy; p.vx *= 0.99; p.a += 0.15; p.life -= 0.006;
    fg.save(); fg.translate(p.x, p.y); fg.rotate(p.a); fg.globalAlpha = Math.max(0, p.life);
    fg.fillStyle = p.c; fg.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); fg.restore();
  }
  parts = parts.filter(p => p.life > 0 && p.y < fx.height + 40);
  if (!parts.length) fg.clearRect(0, 0, fx.width, fx.height);
}

   ========================================================= */
function helpModal(first) {
  openModal(`<h2>🥫 원기둥 하나 더 넣기</h2>
    <p class="lead">상자에 원기둥 <b>40개</b>가 빈틈없이 꽉 찼어요. 그런데 누군가 말했어요. <b>"여기에 하나 더 넣을 수 있어!"</b> 정말일까요?</p>
    <ul>
      <li><span>🖐️</span><span><b>캔 끌기</b>: 캔을 누른 채 끌면 들어 올려 옮길 수 있어요. 바닥의 초록 동그라미가 놓일 자리예요.</span></li>
      <li><span>🔲</span><span><b>여러 개 고르기</b>: 빈 곳을 끌어 네모를 그리면 여러 캔을 한 번에 골라요. (Shift+클릭으로 하나씩 더하기)</span></li>
      <li><span>🧲</span><span><b>자석</b>: 놓을 때 이웃 캔 사이 홈에 딱 맞춰 줘요. 끄면 원하는 곳에 자유롭게 놓을 수 있어요.</span></li>
      <li><span>🔄</span><span><b>화면 돌리기</b>: 마우스 오른쪽 버튼으로 끌거나 두 손가락으로 돌려요. 휠이나 손가락 벌리기로 확대해요.</span></li>
      <li><span>↩️</span><span><b>되돌리기</b>: 실수했으면 되돌리기(Ctrl+Z)를 눌러요.</span></li>
    </ul>
    <div class="card"><b>학습 순서</b> — ① 도전: 직접 41개 넣기 → ② 탐구: 두 구조 비교 → ③ 실험실: 상자 크기 바꿔 보기 → ④ 퀴즈</div>
    <div class="btnrow"><button class="btn primary" data-close>${first ? '도전 시작! 🚀' : '닫기'}</button></div>`);
}
async function doAct(a) {
  switch (a) {
    case 'undo': return undo();
    case 'viewTop': return setView('top');
    case 'viewTilt': return setView('tilt');
    case 'magnet':
      state.magnet = !state.magnet;
      document.querySelector('[data-act=magnet]').classList.toggle('on', state.magnet);
      return toast(state.magnet ? '🧲 자석 켜짐: 홈에 딱 맞춰 놓아 줘요.' : '자석 꺼짐: 원하는 곳에 자유롭게 놓아요.');
    case 'deselect': clearSel(); clearInspect(); return;
    case 'skin':
      state.skin = state.skin === 'wood' ? 'can' : 'wood';
      cans.forEach(applySkin);
      document.querySelector('[data-act=skin] span').textContent = state.skin === 'wood' ? '🪵' : '🥫';
      return toast(state.skin === 'wood' ? '나무 원기둥으로 바꿨어요.' : '음료 캔으로 바꿨어요.');
    case 'sound':
      state.sound = !state.sound;
      document.querySelector('[data-act=sound] span').textContent = state.sound ? '🔊' : '🔇';
      return;
    case 'reset': closeModal(); if (state.mode === 'lab') { labSetup(); renderStats(); renderPanel(); return; } return enterMode(state.mode === 'quiz' ? 'challenge' : state.mode);
    case 'hint':
      state.hintLevel = Math.min(HINTS.length, state.hintLevel + 1);
      if (state.hintLevel === 1) setView('top');
      renderPanel(); $('#panelBody').scrollTop = 1e4; return;
    case 'demo': return demo();
    case 'exSquare': return exploreArrange('square');
    case 'exHex': return exploreArrange('hex');
    case 'toggleShapes': state.showShapes = !state.showShapes; overlayDirty = true; if (state.showShapes) setView('top'); rebuildOverlay(); overlayDirty = false; return renderPanel();
    case 'toggleGaps': state.showGaps = !state.showGaps; gapPlane.visible = state.showGaps; if (state.showGaps) setView('top'); return renderPanel();
    case 'w-': return labResize(-1, 0);
    case 'w+': return labResize(1, 0);
    case 'h-': return labResize(0, -1);
    case 'h+': return labResize(0, 1);
    case 'lab-sq': return labArrange('sq');
    case 'lab-hv': return labArrange('hv');
    case 'lab-hh': return labArrange('hh');
    case 'lab-rec': return labRecord();
    case 'quizOpen': return state.quiz.i >= QUIZ.length ? showQuizEnd() : showQuestion();
    case 'quizRestart': return startQuiz();
  }
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-mode],[data-goto],[data-close],[data-opt],#qnext');
  if (!t) return;
  if (t.dataset.mode) return enterMode(t.dataset.mode);
  if (t.dataset.goto) return enterMode(t.dataset.goto);
  if (t.hasAttribute('data-close')) return closeModal();
  if (t.dataset.opt !== undefined) return answer(Number(t.dataset.opt));
  if (t.id === 'qnext') { state.quiz.i++; return showQuestion(); }
  doAct(t.dataset.act);
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal' && state.mode !== 'quiz') closeModal(); });
$('#helpBtn').addEventListener('click', () => helpModal(false));
$('#panelToggle').addEventListener('click', () => {
  const p = $('#panel'); p.classList.toggle('collapsed');
  $('#panelToggle').textContent = p.classList.contains('collapsed') ? '펼치기' : '접기';
  applyLayout(); setView(state.view || 'tilt');
});
window.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
  else if (e.key === 'Escape') { clearSel(); clearInspect(); closeModal(); }
});

/* =========================================================
   크기 맞추기 · 반복 그리기
   ========================================================= */
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false);
  applyLayout();
}
window.addEventListener('resize', () => { resize(); setView(state.view || 'tilt', true); });

const tmpV = new THREE.Vector3();
function loop() {
  requestAnimationFrame(loop);
  const dt = clock.getDelta(); now += dt;
  let animating = false;
  for (const c of cans) {
    if (!c.active) continue;
    if (drag && drag.moved && drag.members.includes(c)) {
      const i = drag.members.indexOf(c);
      const x = drag.orig[i].x + drag.shift.x, z = drag.orig[i].z + drag.shift.z;
      c.mesh.position.x += (x - c.mesh.position.x) * 0.5;
      c.mesh.position.z += (z - c.mesh.position.z) * 0.5;
      c.mesh.position.y += (CAN_H / 2 + LIFT - c.mesh.position.y) * 0.3;
    } else if (c.anim) {
      const a = c.anim, t = Math.min(1, Math.max(0, (now - a.t0) / a.dur)), e = ease(t);
      c.mesh.position.x = a.fx + (a.tx - a.fx) * e;
      c.mesh.position.z = a.fz + (a.tz - a.fz) * e;
      c.mesh.position.y = a.fy + (baseY(a.tx, a.tz) + CAN_H / 2 - a.fy) * e + Math.sin(Math.PI * e) * a.arc;
      if (t >= 1) { c.anim = null; syncMesh(c); overlayDirty = true; } else animating = true;
    }
  }
  if (camTween) {
    const t = Math.min(1, (now - camTween.t0) / camTween.dur), e = ease(t);
    camera.position.lerpVectors(camTween.fp, camTween.tp, e);
    controls.target.lerpVectors(camTween.ft, camTween.tt, e);
    if (t >= 1) camTween = null;
  }
  controls.update();
  const moving = animating || (drag && drag.moved);
  overlay.visible = !moving;
  if (!moving && overlayDirty) {
    overlayDirty = false; rebuildOverlay();
    if (state.mode === 'explore') renderPanel();
  }
  if (inspect.center) {
    const c = inspect.center, r = canvas.getBoundingClientRect();
    tmpV.set(c.mesh.position.x, c.mesh.position.y + CAN_H / 2, c.mesh.position.z).project(camera);
    const l = $('#label'); l.style.left = (r.left + (tmpV.x + 1) / 2 * r.width) + 'px'; l.style.top = (r.top + (1 - tmpV.y) / 2 * r.height) + 'px';
  }
  if (state.mode === 'challenge' && state.t0) { const tv = document.getElementById('timeVal'); if (tv) tv.textContent = fmtTime(currentTime()); }
  drawFx();
  renderer.render(scene, camera);
}

/* 시작 */
resize();
state.view = 'tilt';
enterMode('challenge', { instant: true });
helpModal(true);
loop();

// 자동 점검용 (콘솔에서 확인 가능)
window.__game = { state, cans, act, insideCount, snapGroup, squarePositions, hexPositions, enterMode, demo, W: () => W, H: () => H, camera, canvas };
</script>
</body>
