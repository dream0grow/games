<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>우리반 게임</title>
<link rel="stylesheet" href="style.css?v=202610071400" />
</head>
<body>
<div class="wrap" style="max-width:1000px">
  <div class="topbar">
    <a class="brand" href="./">🤖 AI와 게임 만들기</a>
    <nav class="nav">
      <a href="./">✏️ 만들기</a>
      <a href="quiz/">🧑‍🏫 인물 퀴즈</a>
      <a href="pro/">🚀 PRO</a>
      <a class="on" href="gallery.html">🎮 우리반 게임</a>
      <a href="../">🌱 곶자왈 게임</a>
    </nav>
  </div>

  <div class="card">
    <h2>🎮 우리반 친구들이 만든 게임</h2>
    <p class="hint">눌러서 친구 게임을 해 봐요!</p>
  </div>

  <div id="loading" class="hint" style="text-align:center;padding:30px">불러오는 중… ⏳</div>
  <div id="err" class="err hidden"></div>
  <div id="empty" class="card hidden" style="text-align:center">
    <p style="font-size:48px">🌱</p>
    <p>아직 올라온 게임이 없어요. <a href="./">첫 번째 게임을 만들어 볼까?</a></p>
  </div>
  <div class="grid" id="grid"></div>

  <footer>© 무릉초 2학년 · 행복한 골든반</footer>
</div>

<script src="../supabase-config.js"></script>
<script src="api.js?v=202610071400"></script>
<script src="quiz/people.js?v=202610071400"></script>
<script src="quiz/data.js?v=202610071400"></script>
<script>
(async function () {
  var GM = window.GameMaker;
  var COLORS = ["#ffd8a8", "#c3fae8", "#d0ebff", "#ffdeeb", "#e5dbff", "#d3f9d8", "#fff3bf"];
  var EMOJIS = ["🎮", "🦋", "🌳", "🐸", "⭐", "🍎", "🚀", "🐞", "🌈", "🐢", "🌸", "🦊"];

  // 제목 글자로 색과 이모지를 고정해서 정함
  function pick(arr, s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return arr[h % arr.length];
  }
  // 제목 안에 이모지가 있으면 그걸 씀
  function firstEmoji(s) {
    var m = s.match(/\p{Extended_Pictographic}/u);
    return m ? m[0] : null;
  }

  function alertBox(msg) { var el = document.getElementById("err"); el.textContent = msg; el.classList.remove("hidden"); }

  // 썸네일이 없는 게임은 실제 게임 화면을 하나씩 찍어서 보여 줌
  // (교실 코드가 있는 기기라면 서버에도 저장해서 다음부터는 바로 보임)
  var shotQueue = [], shooting = false;
  function setShot(thumb, src) {
    thumb.className = "thumb shot";
    thumb.innerHTML = "";
    var img = document.createElement("img"); img.src = src; img.alt = "게임 화면"; img.loading = "lazy";
    thumb.appendChild(img);
  }
  async function runShots() {
    if (shooting) return;
    shooting = true;
    while (shotQueue.length) {
      var job = shotQueue.shift();
      try {
        var full = await GM.getGame(job.id);
        if (!full) continue;
        var pj = GM.unpackProject(full.html);
        var shot = await GM.captureThumb(GM.prepareGame(full.html, pj.idea && pj.idea.quiz));
        var tag = job.thumb.querySelector(".shooting");
        if (shot) {
          setShot(job.thumb, shot);
          if (GM.getCode()) GM.postJson("thumb", { id: job.id, thumb: shot }).catch(function () {});
        } else if (tag) tag.remove();
      } catch (e) {}
    }
    shooting = false;
  }

  try {
    var games = await GM.listGames();
    var ratings = await GM.ratingSummary().catch(function () { return {}; });
    document.getElementById("loading").classList.add("hidden");
    if (!games.length) { document.getElementById("empty").classList.remove("hidden"); return; }
    var grid = document.getElementById("grid");
    games.forEach(function (g) {
      var card = document.createElement("div"); card.className = "gwrap";
      var a = document.createElement("a");
      a.className = "gcard"; a.href = "play.html?id=" + encodeURIComponent(g.id);
      var thumb = document.createElement("div");
      thumb.className = "thumb";
      if (g.thumb) {
        setShot(thumb, g.thumb);
      } else {
        // 화면을 찍기 전까지 잠깐 보여 줄 자리
        thumb.className = "thumb shot";
        thumb.style.background = pick(COLORS, g.title + g.id);
        var ph = document.createElement("div");
        ph.style.cssText = "height:100%;display:flex;align-items:center;justify-content:center;font-size:52px";
        ph.textContent = firstEmoji(g.title) || pick(EMOJIS, g.title);
        var sh = document.createElement("div"); sh.className = "shooting"; sh.textContent = "📸 게임 화면 찍는 중…";
        thumb.appendChild(ph); thumb.appendChild(sh);
        shotQueue.push({ id: g.id, thumb: thumb });
      }
      var body = document.createElement("div"); body.className = "body";
      var h = document.createElement("h3"); h.textContent = g.title;
      var by = document.createElement("div"); by.className = "by"; by.textContent = "만든 친구: " + g.author;
      var p = document.createElement("p"); p.textContent = g.concept || "";
      var dt = document.createElement("div"); dt.className = "date";
      dt.textContent = new Date(g.created_at).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "numeric", minute: "2-digit" });
      body.appendChild(h); body.appendChild(by);
      var rt = ratings[g.id];
      if (rt && rt.count) {
        var rate = document.createElement("div"); rate.className = "rate";
        var avg = rt.sum / rt.count;
        var st = document.createElement("span"); st.className = "stars-ro";
        st.textContent = "★★★★★".slice(0, Math.round(avg)) + "☆☆☆☆☆".slice(0, 5 - Math.round(avg));
        rate.appendChild(st);
        rate.appendChild(document.createTextNode(" " + avg.toFixed(1) + " · 소감 " + rt.count));
        body.appendChild(rate);
      }
      body.appendChild(p); body.appendChild(dt);
      a.appendChild(thumb); a.appendChild(body);
      // 선생님·친구가 교실 코드로 고치거나 숨길 수 있어요
      var act = document.createElement("div"); act.className = "gact";
      var ed = document.createElement("a"); ed.className = "btn small"; ed.textContent = "✏️ 수정하기";
      ed.href = "./?edit=" + encodeURIComponent(g.id);
      var hd = document.createElement("button"); hd.className = "btn small"; hd.textContent = "🙈 숨기기";
      hd.onclick = async function () {
        try {
          if (await GM.hideGame(g.id)) card.remove();
        } catch (e) { alertBox(GM.friendlyError(e)); }
      };
      act.appendChild(ed); act.appendChild(hd);
      card.appendChild(a); card.appendChild(act);
      grid.appendChild(card);
    });
    runShots();
  } catch (e) {
    document.getElementById("loading").classList.add("hidden");
    var el = document.getElementById("err"); el.textContent = GM.friendlyError(e); el.classList.remove("hidden");
  }
})();
</script>
</body>
</html>
